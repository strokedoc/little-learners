<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Little Learners</title>
<meta name="theme-color" content="#FFF8EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Little Learners">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { --bg:#FFF8EC; --ink:#4A4038; --soft:#EFE4D2; --card:#FFFFFF; --accent:#6BAF92; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; touch-action:manipulation;
    font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif; }
  #app { height:100dvh; display:flex; flex-direction:column; align-items:center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
  h1 { font-size: clamp(28px, 7vw, 48px); margin: 8px 0 16px; text-align:center; }
  .center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; text-align:center; width:100%; }
  .big-emoji { font-size: clamp(90px, 25vw, 160px); line-height:1; }
  .msg { font-size: clamp(24px, 6vw, 40px); max-width: 16em; line-height:1.3; }

  /* Home */
  .tiles { flex:1; width:100%; max-width:760px; display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); align-content:center; min-height:0; overflow-y:auto; }
  .tile { background:var(--card); border-radius:28px; padding:12px 8px; display:flex; flex-direction:column; align-items:center; gap:10px;
    box-shadow: 0 4px 0 var(--soft); font-size: clamp(20px, 5vw, 28px); min-height:120px; justify-content:center; }
  .tile .ic { width:60px; height:60px; font-size:52px; line-height:60px; display:flex; align-items:center; justify-content:center; }
  .tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--soft); }
  .gear { position:fixed; right:max(12px, env(safe-area-inset-right)); bottom:max(12px, env(safe-area-inset-bottom)); width:48px; height:48px; font-size:22px; opacity:.35; }

  /* Game */
  .bar { width:100%; max-width:760px; display:flex; align-items:center; justify-content:space-between; }
  .home { width:90px; height:90px; font-size:40px; background:var(--card); border-radius:50%; box-shadow:0 3px 0 var(--soft); }
  .dots { display:flex; gap:10px; }
  .dot { width:16px; height:16px; border-radius:50%; background:var(--soft); }
  .dot.on { background:var(--accent); }
  .prompt { margin-top:12px; font-size: clamp(26px, 7vw, 44px); background:var(--card); border-radius:24px; padding:12px 24px; box-shadow:0 3px 0 var(--soft); text-align:center; }
  .prompt::after { content:" 🔊"; font-size:.7em; opacity:.6; }
  .opts { flex:1; width:100%; max-width:760px; display:flex; flex-wrap:wrap; align-items:center; align-content:center; justify-content:center; gap:20px; }
  .opt { width: clamp(100px, 27vw, 190px); height: clamp(100px, 27vw, 190px); background:var(--card); border-radius:28px; box-shadow:0 4px 0 var(--soft);
    display:flex; align-items:center; justify-content:center; transition: transform .4s ease, opacity .4s ease, box-shadow .4s ease; }
  .opt svg { width:72%; height:72%; }
  .opt .blob { width:72%; aspect-ratio:1; border-radius:50%; }
  .opt .em { font-size: clamp(60px, 17vw, 120px); line-height:1; }
  .opt .em.small { font-size: clamp(28px, 7vw, 46px); }
  .opt.no { opacity:.35; }
  .opt.yes, .opt.hint { box-shadow: 0 0 0 6px var(--accent); }
  .opt.yes { transform: scale(1.08); }
  .scene { position:relative; width:100%; height:100%; border-radius:24px; overflow:hidden;
    background: linear-gradient(#D6ECF8 0 45%, #D4EBC0 45%); }
  .scene .opt { position:absolute; width:auto; height:auto; min-width:90px; min-height:90px; padding:6px; background:none; box-shadow:none; border-radius:50%;
    transform:translate(-50%, -50%); font-size: clamp(40px, 11vw, 64px); line-height:1; }
  .scene .opt.yes { transform:translate(-50%, -50%) scale(1.2); }
  .scene .opt.found { background:rgba(255,255,255,.7); box-shadow:0 0 0 4px var(--accent); }
  .colorer { width:100%; display:flex; align-items:center; justify-content:center; gap:16px; }
  .choose { display:grid; gap:16px; }
  .pick { background:var(--card); border-radius:24px; box-shadow:0 4px 0 var(--soft); padding:10px; display:flex; align-items:center; justify-content:center; }
  .pick canvas { width:100%; height:100%; }
  .pick .em { font-size:80px; }
  .paper { position:relative; background:#fff; border-radius:16px; box-shadow:0 4px 0 var(--soft); overflow:hidden; touch-action:none; }
  .paper canvas { position:absolute; inset:0; width:100%; height:100%; }
  .palette { display:grid; gap:10px; }
  .crayon { border-radius:50%; box-shadow:0 3px 0 var(--soft); }
  .crayon.sel { box-shadow:0 0 0 5px #fff, 0 0 0 9px var(--ink); }
  .glyph { font-size: clamp(64px, 18vw, 120px); color:#9B6BCC; font-weight:800; line-height:1; }
  .tile .glyph { font-size:56px; }
  .puzzle { width:100%; display:flex; flex-direction:column; align-items:center; gap:18px; }
  .board { position:relative; background:var(--card); border-radius:16px; box-shadow:0 4px 0 var(--soft); }
  .board img { display:block; width:100%; height:100%; opacity:.18; border-radius:16px; }
  .tray { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; width:100%; }
  .piece { background-color:#fff; border-radius:10px; box-shadow:0 3px 0 var(--soft); touch-action:none; }
  .piece.drag { position:fixed; z-index:5; box-shadow:0 8px 18px rgba(0,0,0,.15); }
  .piece.placed { position:absolute; border-radius:0; box-shadow:none; }
  .trace { background:var(--card); border-radius:28px; box-shadow:0 4px 0 var(--soft); touch-action:none; }
  .count .opt { width: clamp(90px, 22vw, 150px); height: clamp(90px, 22vw, 150px); position:relative; }
  .count .opt.done .em { opacity:.3; }
  .count .opt .n { position:absolute; font-size: clamp(36px, 9vw, 60px); font-weight:700; color:var(--accent); }

  /* Grown-ups */
  .panel { width:100%; max-width:520px; background:var(--card); border-radius:24px; padding:24px; box-shadow:0 4px 0 var(--soft); font-size:18px; text-align:left; }
  .panel h2 { margin:0 0 12px; font-size:24px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 18px; }
  .chip { padding:12px 18px; border-radius:14px; background:var(--soft); font-size:18px; min-width:64px; }
  .chip.sel { background:var(--accent); color:#fff; }
  .wide { width:100%; padding:16px; border-radius:16px; background:var(--accent); color:#fff; font-size:20px; margin-top:8px; }
  .wide.alt { background:var(--soft); color:var(--ink); }
  .note { font-size:15px; opacity:.75; line-height:1.4; }
  .grown { font-size:16px; opacity:.5; padding:12px; }
  /* Phone held sideways: put the question up beside Home so the game gets the height. */
  @media (max-height: 500px) {
    #app { position:relative; }
    .dots { display:none; }
    .prompt { position:absolute; top:max(16px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%); margin:0; max-width:calc(100% - 280px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .opts { margin-top:12px; }
    .scene .opt { min-width:80px; min-height:80px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- storage (never required to work) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('ll_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ll_' + k, JSON.stringify(v)); } catch {} }
};
let settings = store.get('settings', { minutes: 15, sound: true });
let session = store.get('session', { used: 0, last: 0, locked: false });
// A long break (1 h+) starts a fresh session, unless a parent hasn't unlocked yet.
if (!session.locked && Date.now() - session.last > 3600e3) session.used = 0;

/* ---------- helpers ---------- */
const app = document.getElementById('app');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const pick = a => a[Math.random() * a.length | 0];
const cap = s => s[0].toUpperCase() + s.slice(1);

// queue = true lets counting finish "one, two, three" instead of cutting each number off.
function say(text, queue) {
  if (!settings.sound || !('speechSynthesis' in window)) return;
  if (!queue && speechSynthesis.speaking) speechSynthesis.cancel();  // cancelling when idle can drop the next line on older iOS
  const u = new SpeechSynthesisUtterance(text.replace(/\bA\b/g, 'ay'));  // a lone "A" is otherwise read as "uh"
  u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.1;
  speechSynthesis.speak(u);
}

/* ---------- content ---------- */
const COLORS = [['red', '#E5534B'], ['blue', '#4A90D9'], ['yellow', '#F2C94C'], ['green', '#58B368'], ['orange', '#F2994A'], ['purple', '#9B6BCC']];
const SHAPES = {
  circle: '<circle cx="50" cy="50" r="42"/>',
  square: '<rect x="10" y="10" width="80" height="80" rx="6"/>',
  triangle: '<polygon points="50,8 94,90 6,90"/>',
  star: '<polygon points="50,6 62,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 38,38"/>',
  heart: '<path d="M50 88C20 66 6 50 6 32 6 18 17 8 30 8c10 0 16 6 20 14 4-8 10-14 20-14 13 0 24 10 24 24 0 18-14 34-44 56z"/>'
};
const svg = (name, fill) => `<svg viewBox="0 0 100 100" fill="${fill}">${SHAPES[name]}</svg>`;
const ANIMALS = [['🐄', 'moo', 'cow'], ['🐶', 'woof', 'dog'], ['🐱', 'meow', 'cat'], ['🦆', 'quack', 'duck'], ['🐑', 'baa', 'sheep'],
  ['🐷', 'oink', 'pig'], ['🦁', 'roar', 'lion'], ['🐸', 'ribbit', 'frog'], ['🐔', 'cluck', 'chicken']];
const THINGS = ['🍎', '🐟', '⭐', '🚗', '🐞', '🌸', '🍌', '🎈', '🐥', '⚽'];

// Capital letters as finger strokes on a 100×100 grid. arc() makes curves; angles in degrees, 0 = right, 90 = down.
const arc = (cx, cy, rx, ry, a0, a1, n = 14) => Array.from({ length: n + 1 }, (_, i) => {
  const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)];
});
const P_BOWL = [[28, 10], [52, 10], ...arc(52, 31, 20, 21, -90, 90), [28, 52]];
const O_RING = arc(50, 50, 30, 40, -90, 270, 28);
const LETTERS = {
  A: [[[50, 10], [20, 90]], [[50, 10], [80, 90]], [[33, 60], [67, 60]]],
  B: [[[28, 10], [28, 90]], [[28, 10], [52, 10], ...arc(52, 29, 18, 19, -90, 90), [28, 48]], [[28, 48], [55, 48], ...arc(55, 69, 21, 21, -90, 90), [28, 90]]],
  C: [arc(52, 50, 30, 40, -45, -315, 24)],
  D: [[[28, 10], [28, 90]], [[28, 10], [42, 10], ...arc(42, 50, 32, 40, -90, 90, 20), [28, 90]]],
  E: [[[72, 10], [28, 10], [28, 90], [72, 90]], [[28, 50], [64, 50]]],
  F: [[[72, 10], [28, 10], [28, 90]], [[28, 50], [62, 50]]],
  G: [arc(52, 50, 30, 40, -45, -360, 24), [[82, 50], [58, 50]]],
  H: [[[25, 10], [25, 90]], [[75, 10], [75, 90]], [[25, 50], [75, 50]]],
  I: [[[50, 10], [50, 90]], [[32, 10], [68, 10]], [[32, 90], [68, 90]]],
  J: [[[65, 10], [65, 68], ...arc(47, 68, 18, 22, 0, 180)]],
  K: [[[28, 10], [28, 90]], [[72, 10], [28, 56]], [[42, 42], [74, 90]]],
  L: [[[30, 10], [30, 90], [72, 90]]],
  M: [[[20, 90], [20, 10], [50, 60], [80, 10], [80, 90]]],
  N: [[[25, 90], [25, 10], [75, 90], [75, 10]]],
  O: [O_RING],
  P: [[[28, 10], [28, 90]], P_BOWL],
  Q: [O_RING, [[58, 70], [80, 92]]],
  R: [[[28, 10], [28, 90]], P_BOWL, [[45, 52], [74, 90]]],
  S: [[...arc(50, 30, 22, 20, -30, -270), ...arc(50, 70, 22, 20, -90, 150)]],
  T: [[[20, 10], [80, 10]], [[50, 10], [50, 90]]],
  U: [[[25, 10], ...arc(50, 60, 25, 30, 180, 0), [75, 10]]],
  V: [[[20, 10], [50, 90], [80, 10]]],
  W: [[[12, 10], [30, 90], [50, 30], [70, 90], [88, 10]]],
  X: [[[22, 10], [78, 90]], [[78, 10], [22, 90]]],
  Y: [[[22, 10], [50, 50], [78, 10]], [[50, 50], [50, 90]]],
  Z: [[[22, 10], [78, 10], [22, 90], [78, 90]]]
};
const WORDS = { A: ['apple', '🍎'], B: ['ball', '⚽'], C: ['cat', '🐱'], D: ['dog', '🐶'], E: ['elephant', '🐘'], F: ['fish', '🐟'],
  G: ['grapes', '🍇'], H: ['house', '🏠'], I: ['ice cream', '🍦'], J: ['juice', '🧃'], K: ['key', '🔑'], L: ['lion', '🦁'],
  M: ['moon', '🌙'], N: ['nose', '👃'], O: ['orange', '🍊'], P: ['pig', '🐷'], Q: ['queen', '👸'], R: ['rainbow', '🌈'],
  S: ['sun', '☀️'], T: ['tree', '🌳'], U: ['umbrella', '☂️'], V: ['violin', '🎻'], W: ['whale', '🐳'], X: ['fox', '🦊'],
  Y: ['yo-yo', '🪀'], Z: ['zebra', '🦓'] };

const letterPraise = L => L === 'X' ? 'X! Fox ends with X!' : `${L}! ${L} is for ${WORDS[L][0]}!`;

// Pitched at her level: colours/shapes/counting are stretch versions; most games build the alphabet.
// Each make() returns one question: id (to avoid repeats), prompt, praise, a real-world "go find" line, and its options.
const GAMES = {
  letters: { title: 'Trace', icon: '<b class="glyph">A</b>', trace: true, make() {
    const L = pick(Object.keys(LETTERS));
    return { id: L, strokes: LETTERS[L], prompt: `Trace the letter ${L}.`, praise: letterPraise(L), reveal: `${L} ${WORDS[L][1]}`,
      find: `Can you draw a big ${L} in the air with your finger?` };
  } },
  hunt: { title: 'Find the Letter', icon: '🔍', make() {
    const opts = sample(Object.keys(WORDS), 3), L = opts[0];
    return { id: L, prompt: `Find the letter ${L}.`, praise: letterPraise(L), reveal: `${L} ${WORDS[L][1]}`,
      find: `Can you find the letter ${L} in a book or on a sign?`,
      options: shuffle(opts).map(o => ({ html: `<b class="glyph">${o}</b>`, correct: o === L })) };
  } },
  puzzle: { title: 'Puzzle', icon: '🧩', puzzle: true, rounds: 3, make() {
    const L = pick(Object.keys(WORDS).filter(l => l !== 'X')), [word, emoji] = WORDS[L];
    return { id: L, L, emoji, prompt: 'Put the puzzle together!', praise: letterPraise(L), reveal: `${L} is for ${word}`,
      find: `Can you say it? ${L}, ${L}, ${word}!` };
  } },
  seek: { title: 'I Spy', icon: '👀', seek: true, make() {
    const t = pick(cur.scene.filter(o => !cur.found.includes(o.L))), [word, emoji] = WORDS[t.L];
    return { id: t.L, prompt: `Can you find the ${word}?`, reveal: `${t.L} ${emoji}`, find: 'Can you spy something blue in this room?',
      praise: t.L === 'X' ? 'You found the fox!' : `You found the ${word}! ${cap(word)} starts with ${t.L}.`,
      options: cur.scene.map(o => ({ html: WORDS[o.L][1], name: WORDS[o.L][0], correct: o === t, found: cur.found.includes(o.L) })) };
  } },
  colorshape: { title: 'Colors & Shapes', icon: svg('star', '#F2C94C'), make() {
    const shapes = Object.keys(SHAPES), c = pick(COLORS), s = pick(shapes);
    const not = (arr, x) => pick(arr.filter(y => y !== x));
    // Distractors share the colour or the shape, so she has to check both.
    const opts = [[c, s], [not(COLORS, c), s], [c, not(shapes, s)], [not(COLORS, c), not(shapes, s)]];
    return { id: c[0] + s, prompt: `Find the ${c[0]} ${s}.`, praise: `Yes! The ${c[0]} ${s}!`, find: `Can you find something ${c[0]} near you?`,
      options: shuffle(opts).map(([oc, os]) => ({ html: svg(os, oc[1]), correct: oc === c && os === s })) };
  } },
  counting: { title: 'Counting', icon: '🖐️', count: true, make() {
    const n = 3 + (Math.random() * 8 | 0), thing = pick(THINGS);
    return { id: n, n, thing, prompt: 'Tap each one to count!', praise: `${n}! You counted ${n}!`, reveal: String(n), find: 'Can you count your toes?' };
  } },
  color: { title: 'Coloring', icon: '🖍️', color: true, rounds: 2, make() {
    const choices = [...sample(Object.keys(PAGES), 2), 'letter:' + pick(Object.keys(LETTERS)), 'blank'];
    return { id: Math.random(), choices, prompt: 'Pick a picture to color!', find: 'Can you show a grown-up your pictures?' };
  } },
  animals: { title: 'Animals', icon: '🐄', make() {
    const opts = sample(ANIMALS, 3), [, sound, name] = opts[0];
    return { id: name, prompt: `Who says ${sound}?`, praise: `Yes! The ${name} says ${sound}!`, find: `Can you say ${sound}, like a ${name}?`,
      options: shuffle(opts).map(a => ({ html: `<span class="em">${a[0]}</span>`, correct: a[2] === name })) };
  } }
};

/* ---------- session timer (rule 1) ---------- */
let screen = 'home';
function save() { store.set('session', session); }
function timeUp() { return session.used >= settings.minutes * 60; }
let lastTick = Date.now();
setInterval(() => {
  const now = Date.now(), dt = Math.min(now - lastTick, 15000) / 1000; lastTick = now;  // capped so app suspensions don't count
  if (document.hidden || session.locked) return;
  session.used += dt; session.last = now;
  // Lock (and save) right away; the rest screen shows between questions so nothing is cut off mid-way.
  if (timeUp()) {
    session.locked = true;
    if (screen === 'home' || screen === 'done') showRest();
    else if (screen === 'game' && GAMES[cur.key].color && !cur.warned) {  // colouring never "ends", so: one minute's warning, then rest
      cur.warned = true; say('One more minute to finish your picture!');
      setTimeout(() => { if (screen === 'game') showRest(); }, 60000);
    }
  }
  save();
}, 5000);

/* ---------- screens ---------- */
function showHome() {
  clearTimeout(pending);
  if (session.locked || timeUp()) return showRest();
  screen = 'home';
  app.innerHTML = `<h1>Let's play!</h1><div class="tiles">${Object.entries(GAMES).map(([k, g]) =>
    `<button class="tile" data-g="${k}"><span class="ic">${g.icon}</span>${g.title}</button>`).join('')}</div>
    <button class="gear" aria-label="Grown-ups">⚙️</button>`;
  app.querySelectorAll('.tile').forEach(b => b.onclick = () => startGame(b.dataset.g));
  app.querySelector('.gear').onclick = () => showGate(showSettings);
}

let cur = null, busy = false, pending = 0;
const later = (fn, ms) => { clearTimeout(pending); pending = setTimeout(fn, ms); };  // one pending step; Home cancels it
function startGame(key) { cur = { key, q: 0, prev: null }; nextQ(); }

function nextQ() {
  busy = false;
  if (session.locked || timeUp()) return showRest();
  const g = GAMES[cur.key], rounds = g.rounds || 5;
  if (cur.q >= rounds) return showDone();
  if (g.seek && !cur.scene) { cur.scene = makeScene(); cur.found = []; }  // one scene for the whole round
  let item; do { item = g.make(); } while (item.id === cur.prev);
  cur.q++; cur.prev = item.id; cur.item = item;
  render();
  say(cur.q === 1 ? `${g.title}! ${item.prompt}` : item.prompt);  // first question also names the game (she can't read the tiles)
}

// Draws the current question. Re-run on rotation so it fits the new screen (that one question restarts).
function render() {
  const g = GAMES[cur.key], rounds = g.rounds || 5, item = cur.item;
  cur.misses = 0; cur.counted = 0; screen = 'game';
  if (g.seek) layoutScene(cur.scene);
  const dots = Array.from({ length: rounds }, (_, i) => `<span class="dot ${i < cur.q ? 'on' : ''}"></span>`).join('');
  const opts = g.color ? '<div class="colorer"></div>'
    : g.seek ? `<div class="scene">${item.options.map((o, i) =>
      `<button class="opt ${o.found ? 'found' : ''}" data-i="${i}" style="left:${cur.scene[i].x}%;top:${cur.scene[i].y}%">${o.html}</button>`).join('')}</div>`
    : g.puzzle ? '<div class="puzzle"></div>'
    : g.trace ? '<canvas class="trace"></canvas>'
    : g.count ? Array.from({ length: item.n }, () => `<button class="opt"><span class="em">${item.thing}</span></button>`).join('')
    : item.options.map((o, i) => `<button class="opt" data-i="${i}">${o.html}</button>`).join('');
  app.innerHTML = `<div class="bar"><button class="home" aria-label="Home">🏠</button><div class="dots">${dots}</div>${g.color && item.page
    ? '<button class="home done-btn" aria-label="Finished">✅</button>' : '<span style="width:90px"></span>'}</div>
    <button class="prompt">${item.prompt}</button><div class="opts ${g.count ? 'count' : ''}">${opts}</div>`;
  app.querySelector('.home').onclick = showHome;
  app.querySelector('.prompt').onclick = () => say(item.prompt);
  if (g.trace) setupTrace(app.querySelector('.trace'), item);
  if (g.puzzle) setupPuzzle(app.querySelector('.puzzle'), item);
  if (g.color) setupColor(app.querySelector('.colorer'), item);
  const done = app.querySelector('.done-btn');

  app.querySelectorAll('.opt').forEach(b => b.onclick = () => g.count ? countTap(b) : answer(b));

// Tracing is forgiving on purpose: any order or direction, and a stroke counts once the finger has covered most of it.
function setupTrace(cv, item) {
  const S = Math.min(cv.parentElement.clientWidth, cv.parentElement.clientHeight, 520), dpr = window.devicePixelRatio || 1;
  cv.style.width = cv.style.height = S + 'px';
  cv.width = cv.height = S * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr * S / 100, dpr * S / 100); ctx.lineCap = ctx.lineJoin = 'round';
  const strokes = item.strokes.map(pts => {
    const samples = [];  // a point every ~3 units along the stroke
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 3));
      for (let j = 0; j <= n; j++) samples.push([x0 + (x1 - x0) * j / n, y0 + (y1 - y0) * j / n]);
    }
    return { pts, samples, hit: samples.map(() => false), done: false };
  });
  const ink = [];
  let trail = null;
  const line = (pts, color, w) => {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  };
  const draw = () => {
    ctx.clearRect(0, 0, 100, 100);
    strokes.forEach(s => line(s.pts, s.done ? '#9B6BCC' : '#EFE4D2', 14));
    ink.forEach(t => line(t, 'rgba(155,107,204,.5)', 7));
    const next = strokes.find(s => !s.done);  // green dot shows where to start
    if (next) { ctx.fillStyle = '#58B368'; ctx.beginPath(); ctx.arc(next.pts[0][0], next.pts[0][1], 6, 0, 7); ctx.fill(); }
  };
  const mark = ([x, y]) => strokes.forEach(s => {
    if (s.done) return;
    s.samples.forEach(([sx, sy], i) => { if ((sx - x) ** 2 + (sy - y) ** 2 < 110) s.hit[i] = true; });
    if (s.hit.filter(Boolean).length >= 0.85 * s.hit.length) s.done = true;
  });
  const at = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100]; };
  const move = p => {
    const last = trail[trail.length - 1] || p, n = Math.max(1, Math.ceil(Math.hypot(p[0] - last[0], p[1] - last[1]) / 3));
    for (let j = 1; j <= n; j++) mark([last[0] + (p[0] - last[0]) * j / n, last[1] + (p[1] - last[1]) * j / n]);
    trail.push(p); draw();
    if (strokes.every(s => s.done)) {
      busy = true; trail = null; ink.length = 0; draw();
      app.querySelector('.prompt').textContent = item.reveal; say(item.praise);
      later(nextQ, 3200);
    }
  };
  cv.onpointerdown = e => { if (busy) return; cv.setPointerCapture(e.pointerId); trail = []; ink.push(trail); move(at(e)); };
  cv.onpointermove = e => { if (trail && !busy) move(at(e)); };
  cv.onpointerup = cv.onpointercancel = () => { trail = null; };
  draw();
}

function answer(b) {
  if (busy || b.classList.contains('no')) return;
  const item = cur.item;
  if (item.options[b.dataset.i].correct) {
    busy = true; b.classList.add('yes'); say(item.praise);
    if (item.reveal) app.querySelector('.prompt').textContent = item.reveal;
    if (cur.found) cur.found.push(item.id);
    later(nextQ, 2200);
  } else {
    const name = item.options[b.dataset.i].name;  // in I Spy, a wrong tap still teaches a word
    b.classList.add('no'); say(name ? `That's the ${name}.` : 'Try again.');
    if (++cur.misses >= 2) app.querySelectorAll('.opt').forEach(o => { if (item.options[o.dataset.i].correct) o.classList.add('hint'); });
  }
}

function countTap(b) {
  if (busy || b.classList.contains('done')) return;
  b.classList.add('done');
  b.insertAdjacentHTML('beforeend', `<span class="n">${++cur.counted}</span>`);
  if (cur.counted === cur.item.n) {
    busy = true; app.querySelector('.prompt').textContent = cur.item.reveal;  // link the count to the written number
    say(cur.item.praise, true); later(nextQ, 3500);
  }
  else say(String(cur.counted), true);
}

// 12 alphabet pictures on a 15-cell grid (3×5 upright, 5×3 sideways) with a little jitter, so big tap areas never overlap.
function makeScene() { return sample(Object.keys(WORDS), 12).map(L => ({ L })); }
function layoutScene(scene) {
  const wide = innerWidth > innerHeight;
  if (scene.wide === wide) return;  // keep positions steady for the whole round unless the screen rotates
  scene.wide = wide;
  const cols = wide ? 5 : 3, rows = 15 / cols, cells = shuffle([...Array(15).keys()]);
  scene.forEach((o, k) => {
    o.x = (cells[k] % cols + 0.5 + (Math.random() - 0.5) * 0.2) * 100 / cols;
    o.y = ((cells[k] / cols | 0) + 0.5 + (Math.random() - 0.5) * 0.2) * 100 / rows;
  });
}

// The picture is a letter plus its word-picture, cut into 3×2 pieces. A faint copy on the board shows where each goes.
function setupPuzzle(box, item) {
  const c = document.createElement('canvas'); c.width = 600; c.height = 400;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, 600, 400); x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#9B6BCC'; x.font = '800 300px ui-rounded, system-ui, sans-serif'; x.fillText(item.L, 160, 215);
  x.font = '230px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif'; x.fillText(item.emoji, 440, 215);
  // Piece size s fits both width and height: board (3s × 2s) and tray (3 per row) stacked, or side by side on wide short screens.
  const img = c.toDataURL(), bw = box.clientWidth, bh = box.parentElement.clientHeight, wide = bw > bh * 1.3;
  const s = Math.floor(Math.min(wide ? (bw - 48) / 6 : (bw - 20) / 3, wide ? (bh - 10) / 2 : (bh - 38) / 4, 150)), W = 3 * s;
  box.style.flexDirection = wide ? 'row' : 'column';
  box.innerHTML = `<div class="board" style="width:${W}px;height:${2 * s}px"><img src="${img}" alt=""></div>
    <div class="tray" style="width:${W + 20}px;min-height:${2 * s + 10}px"></div>`;  // fixed size so the board never jumps
  const board = box.querySelector('.board'), tray = box.querySelector('.tray');
  let left = 6;
  shuffle([0, 1, 2, 3, 4, 5]).forEach(i => {
    const col = i % 3, row = i / 3 | 0, p = document.createElement('div');
    p.className = 'piece';
    p.style.cssText = `width:${s}px;height:${s}px;background-image:url(${img});background-size:${W}px ${2 * s}px;background-position:-${col * s}px -${row * s}px`;
    tray.appendChild(p);
    let dx, dy;
    p.onpointerdown = e => {
      if (busy || p.dataset.placed) return;
      p.setPointerCapture(e.pointerId);
      const r = p.getBoundingClientRect(); dx = e.clientX - r.left; dy = e.clientY - r.top;
      p.classList.add('drag'); p.style.left = r.left + 'px'; p.style.top = r.top + 'px';
    };
    p.onpointermove = e => { if (p.classList.contains('drag')) { p.style.left = e.clientX - dx + 'px'; p.style.top = e.clientY - dy + 'px'; } };
    p.onpointerup = p.onpointercancel = () => {
      if (!p.classList.contains('drag')) return;
      const r = p.getBoundingClientRect(), b = board.getBoundingClientRect();  // measure before leaving drag mode
      p.classList.remove('drag');
      if (Math.hypot(r.left - (b.left + col * s), r.top - (b.top + row * s)) < s * 0.45) {  // close enough: snap in
        p.dataset.placed = 1; p.classList.add('placed'); board.appendChild(p);
        p.style.left = col * s + 'px'; p.style.top = row * s + 'px';
        if (!--left) { busy = true; app.querySelector('.prompt').textContent = item.reveal; say(item.praise); later(nextQ, 3500); }
      } else {  // gently back to the tray; a soft word only if she was trying on the board
        const cx = r.left + s / 2, cy = r.top + s / 2;
        if (cx > b.left && cx < b.right && cy > b.top && cy < b.bottom) say('Try again.');
        p.style.left = p.style.top = '';
      }
    };
  });
}

// Bubble letter from the tracing strokes: a thick dark line with its middle cut out leaves a hollow letter to colour in.
function bubble(x, L, ox, oy, size) {
  x.save(); x.translate(ox, oy); x.scale(size / 100, size / 100);
  const tube = w => { x.lineWidth = w; LETTERS[L].forEach(p => { x.beginPath(); p.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.stroke(); }); };
  tube(20); x.globalCompositeOperation = 'destination-out'; tube(14);
  x.restore();
}

  x.scale(RES / 600, RES / 600); x.lineWidth = 8; x.lineJoin = x.lineCap = 'round'; x.strokeStyle = x.fillStyle = '#3A3330';
  if (key.startsWith('letter:')) bubble(x, key.slice(7), 60, 60, 480);
  else if (key !== 'blank') { PAGES[key].draw(x); x.lineWidth = 8; bubble(x, PAGES[key].L, 15, 15, 150); }
  return c;
}

const pagePrompt = k => k === 'blank' ? 'Draw anything you like!'
  : k.startsWith('letter:') ? `Let's color the letter ${k.slice(7)}! ${k.slice(7)} is for ${WORDS[k.slice(7)][0]}.`
  : `Let's color the ${k}! ${PAGES[k].L} is for ${k}.`;

// The shape under the finger when a stroke starts (flood fill up to the lines). The crayon only paints inside it.
function regionMask(walls, sx, sy) {
  const N = RES; let start = sy * N + sx;
  for (let r = 1; r <= 12 && walls[start]; r++)  // started on a line: use the nearest open spot
    for (let dy = -r; dy <= r && walls[start]; dy++) for (let dx = -r; dx <= r; dx++) {
      const x = sx + dx, y = sy + dy;
      if (x >= 0 && y >= 0 && x < N && y < N && !walls[y * N + x]) { start = y * N + x; break; }
    }
  if (walls[start]) return null;
  const m = new Uint8Array(N * N), stack = [start]; m[start] = 1;
  while (stack.length) {
    const i = stack.pop(), x = i % N;
    for (const j of [x > 0 ? i - 1 : -1, x < N - 1 ? i + 1 : -1, i - N, i + N])
      if (j >= 0 && j < N * N && !m[j] && !walls[j]) { m[j] = 1; stack.push(j); }
  }
  const c = document.createElement('canvas'); c.width = c.height = N;
  const cx = c.getContext('2d'), img = cx.createImageData(N, N);
  for (let i = 0; i < m.length; i++) if (m[i]) img.data[i * 4 + 3] = 255;
  cx.putImageData(img, 0, 0);
  return c;
}

const CRAYONS = ['#E5534B', '#F2994A', '#F2C94C', '#58B368', '#4A90D9', '#9B6BCC', '#F49AC1', '#A0522D'];
const scratch = document.createElement('canvas'); scratch.width = scratch.height = RES;

function setupColor(box, item) {
  const bw = box.clientWidth, bh = box.parentElement.clientHeight;
  if (!item.page) {  // pick one of 4: two pictures, a letter, a blank page
    const t = Math.floor(Math.min((bw - 16) / 2, (bh - 16) / 2, 340));
    box.innerHTML = `<div class="choose" style="grid-template-columns:repeat(2, ${t}px)">${item.choices.map(k =>
      `<button class="pick" data-k="${k}" style="width:${t}px;height:${t}px">${k === 'blank' ? '<span class="em">✏️</span>' : ''}</button>`).join('')}</div>`;
    box.querySelectorAll('.pick').forEach(b => {
      if (b.dataset.k !== 'blank') b.append(drawPage(b.dataset.k));
      b.onclick = () => { item.page = b.dataset.k; item.prompt = pagePrompt(item.page); render(); say(item.prompt); };
    });
    return;
  }
  if (!item.layer) {  // kept on the item so rotating the screen never loses her colouring
    item.layer = document.createElement('canvas'); item.layer.width = item.layer.height = RES;
    item.lines = drawPage(item.page);
    const a = item.lines.getContext('2d').getImageData(0, 0, RES, RES).data;
    item.walls = new Uint8Array(RES * RES).map((_, i) => a[i * 4 + 3] > 100);
    item.crayon = CRAYONS[0];
  }
  // Paper plus 8 big crayons: below the paper when upright, beside it when the screen is wide.
  const wide = bw > bh * 1.2, cols = wide ? 2 : bw >= 700 ? 8 : 4, rows = 8 / cols;
  const sw = Math.floor(Math.min(90, wide ? (bh - 30) / 4 : (bw - (cols - 1) * 10) / cols));
  const S = Math.floor(wide ? Math.min(bh, bw - cols * (sw + 10) - 16) : Math.min(bw, bh - rows * (sw + 10) - 12));
  box.style.flexDirection = wide ? 'row' : 'column';
  box.innerHTML = `<div class="paper" style="width:${S}px;height:${S}px"></div><div class="palette" style="grid-template-columns:repeat(${cols}, ${sw}px)">${
    CRAYONS.map(c => `<button class="crayon ${c === item.crayon ? 'sel' : ''}" data-c="${c}" style="background:${c};width:${sw}px;height:${sw}px"></button>`).join('')}</div>`;
  const paper = box.querySelector('.paper');
  paper.append(item.layer, item.lines);
  box.querySelectorAll('.crayon').forEach(b => b.onclick = () => {
    item.crayon = b.dataset.c; box.querySelectorAll('.crayon').forEach(o => o.classList.toggle('sel', o === b));
  });
  const lx = item.layer.getContext('2d'), sx = scratch.getContext('2d');
  let mask = null, last = null;
  const at = e => { const r = paper.getBoundingClientRect(), k = v => Math.max(0, Math.min(RES - 1, v));
    return [k((e.clientX - r.left) / r.width * RES), k((e.clientY - r.top) / r.height * RES)]; };
  const paint = (a, b) => {  // stroke on scratch, trim to the shape, copy onto the picture (only the small box around the stroke)
    const x0 = Math.max(0, Math.min(a[0], b[0]) - 30 | 0), y0 = Math.max(0, Math.min(a[1], b[1]) - 30 | 0);
    const w = Math.min(RES - x0, Math.abs(a[0] - b[0]) + 60 | 0), h = Math.min(RES - y0, Math.abs(a[1] - b[1]) + 60 | 0);
    sx.clearRect(x0, y0, w, h);
    sx.strokeStyle = item.crayon; sx.lineWidth = 36; sx.lineCap = 'round';
    sx.beginPath(); sx.moveTo(a[0], a[1]); sx.lineTo(b[0] + 0.01, b[1]); sx.stroke();
    sx.globalCompositeOperation = 'destination-in'; sx.drawImage(mask, x0, y0, w, h, x0, y0, w, h);
    sx.globalCompositeOperation = 'source-over';
    lx.drawImage(scratch, x0, y0, w, h, x0, y0, w, h);
  };
  paper.onpointerdown = e => {
    if (busy) return;
    paper.setPointerCapture(e.pointerId);
    last = at(e); mask = regionMask(item.walls, last[0] | 0, last[1] | 0);
    if (mask) paint(last, last);
  };
  paper.onpointermove = e => { if (!mask) return; const p = at(e); paint(last, p); last = p; };
  paper.onpointerup = paper.onpointercancel = () => { mask = null; };
}

function showDone() {
  screen = 'done';
  const find = cur.item.find;
  app.innerHTML = `<div class="center"><div class="big-emoji">👏</div><div class="msg">All done!<br>${find}</div>
    <button class="home" style="width:110px;height:110px;font-size:60px" aria-label="Home">🏠</button></div>`;
  app.querySelector('.home').onclick = showHome;
  say('All done! ' + find);
}

function showRest() {
  screen = 'rest';
  if (!session.locked) { session.locked = true; save(); }
  app.innerHTML = `<div class="center"><div class="big-emoji">🌙</div>
    <div class="msg">Screen time is all done!<br>Let's go play with toys.</div></div>
    <button class="grown">Grown-ups</button>`;
  app.querySelector('.grown').onclick = () => showGate(showSettings);
  say("Screen time is all done! Let's go play with toys.");
}

/* ---------- parent gate + settings (rule 7) ---------- */
function showGate(onPass, back = screen === 'rest' ? showRest : showHome, step = 0) {
  screen = 'gate';
  const a = 6 + (Math.random() * 9 | 0), b = 6 + (Math.random() * 9 | 0), sum = a + b;
  const choices = shuffle([sum, sum + 1, sum - 2, sum + 3]);
  app.innerHTML = `<div class="center"><div class="panel"><h2>For grown-ups</h2>
    <p>${step + 1} of 2: What is ${a} + ${b}?</p><div class="row">${choices.map(c => `<button class="chip" data-v="${c}">${c}</button>`).join('')}</div>
    <button class="wide alt">Back</button></div></div>`;
  app.querySelectorAll('.chip').forEach(c => c.onclick = () => (+c.dataset.v !== sum ? back() : step ? onPass() : showGate(onPass, back, 1)));
  app.querySelector('.wide').onclick = back;
}

function showSettings() {
  screen = 'settings';
  const usedMin = Math.floor(session.used / 60);
  app.innerHTML = `<div class="center"><div class="panel"><h2>Grown-up settings</h2>
    <div>Session length</div><div class="row">${[10, 15, 20].map(m =>
      `<button class="chip ${settings.minutes === m ? 'sel' : ''}" data-m="${m}">${m} min</button>`).join('')}</div>
    <div>Voice</div><div class="row">${[true, false].map(s =>
      `<button class="chip ${settings.sound === s ? 'sel' : ''}" data-s="${s}">${s ? 'On' : 'Off'}</button>`).join('')}</div>
    <p class="note">Used this session: ${usedMin} of ${settings.minutes} min${session.locked ? ' (locked)' : ''}.<br>
    Tip: turn on Guided Access (iPhone/iPad Settings → Accessibility) so the app can't be swiped away.</p>
    <button class="wide" id="fresh">Start a new session</button>
    <button class="wide alt" id="back">Back</button></div></div>`;
  app.querySelectorAll('[data-m]').forEach(c => c.onclick = () => { settings.minutes = +c.dataset.m; store.set('settings', settings); showSettings(); });
  app.querySelectorAll('[data-s]').forEach(c => c.onclick = () => { settings.sound = c.dataset.s === 'true'; store.set('settings', settings); showSettings(); });
  app.querySelector('#fresh').onclick = () => { session = { used: 0, last: Date.now(), locked: false }; save(); showHome(); };
  app.querySelector('#back').onclick = showHome;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
showHome();
</script>
</body>
</html>
