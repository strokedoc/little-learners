<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Little Learners</title>
<meta name="theme-color" content="#FFF6E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Little Learners">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family:Fredoka; src:url(fonts/fredoka.woff2) format('woff2'); font-weight:300 700; font-display:swap; }
  :root { --bg:#FFF6E9; --ink:#433A35; --soft:#EADBC8; --card:#FFFFFF; --accent:#5DB58A; --purple:#8E63CE; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
  html, body { margin:0; height:100%; color:var(--ink); overflow:hidden; touch-action:manipulation; font-family:Fredoka, ui-rounded, system-ui, sans-serif; font-weight:500;
    background: radial-gradient(circle at 12% 8%, #FFE3EC 0 18%, transparent 19%), radial-gradient(circle at 92% 18%, #DDF0FF 0 14%, transparent 15%),
      radial-gradient(circle at 85% 95%, #E6F6DF 0 20%, transparent 21%), var(--bg); }
  #app { height:100dvh; display:flex; flex-direction:column; align-items:center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
  h1 { font-size: clamp(32px, 8vw, 56px); font-weight:600; margin: 4px 0 14px; text-align:center; letter-spacing:.5px; }
  h1 span { color:var(--purple); }
  .center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; text-align:center; width:100%; }
  .big-emoji { font-size: clamp(90px, 25vw, 160px); line-height:1; filter: drop-shadow(0 6px 8px rgba(0,0,0,.12)); }
  .msg { font-size: clamp(24px, 6vw, 40px); max-width: 16em; line-height:1.3; font-weight:600; }
  .card { background:var(--card); border-radius:28px; box-shadow: 0 5px 0 var(--soft), 0 10px 24px rgba(120, 90, 60, .10); }

  /* Home */
  .tiles { flex:1; width:100%; max-width:780px; display:grid; gap:14px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); align-content:center; min-height:0; overflow-y:auto; padding:4px; }
  .tile { border-radius:28px; padding:12px 8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:118px;
    font-size: clamp(19px, 4.6vw, 26px); font-weight:600; background:var(--tint); box-shadow: 0 5px 0 var(--shade), 0 10px 20px rgba(120, 90, 60, .10); }
  .tile .ic { width:68px; height:68px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:42px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.06); }
  .tile .ic svg { width:46px; height:46px; }
  .tile:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shade); }
  .gear { position:fixed; right:max(12px, env(safe-area-inset-right)); bottom:max(12px, env(safe-area-inset-bottom)); width:48px; height:48px; font-size:22px; opacity:.3; }

  /* Game chrome */
  .bar { width:100%; max-width:780px; display:flex; align-items:center; justify-content:space-between; }
  .home { width:90px; height:90px; font-size:40px; border-radius:50%; background:var(--card); box-shadow: 0 4px 0 var(--soft), 0 8px 16px rgba(120,90,60,.10); }
  .ref { width:90px; height:60px; border-radius:12px; background:#fff center/cover; box-shadow: 0 3px 0 var(--soft); }
  .dots { display:flex; gap:10px; }
  .dot { width:16px; height:16px; border-radius:50%; background:var(--soft); }
  .dot.on { background:var(--accent); }
  .prompt { position:relative; margin-top:12px; max-width:780px; font-size: clamp(24px, 6.4vw, 42px); font-weight:600; background:var(--card); border-radius:26px; padding:12px 26px;
    box-shadow: 0 4px 0 var(--soft), 0 8px 18px rgba(120,90,60,.08); text-align:center; line-height:1.2; }
  .prompt::after { content:" 🔊"; font-size:.6em; opacity:.55; }
  .prompt .pic { font-size:1.4em; vertical-align:middle; }
  .opts { flex:1; width:100%; max-width:780px; display:flex; flex-wrap:wrap; align-items:center; align-content:center; justify-content:center; gap:18px; margin-top:10px; min-height:0; }
  .opt { width: clamp(96px, 26vw, 180px); height: clamp(96px, 26vw, 180px); display:flex; align-items:center; justify-content:center;
    transition: transform .35s ease, opacity .35s ease, box-shadow .35s ease; }
  .opts.many .opt { width: clamp(90px, 21vw, 150px); height: clamp(90px, 21vw, 150px); }
  .opt svg { width:74%; height:74%; overflow:visible; filter: drop-shadow(0 4px 3px rgba(0,0,0,.12)); }
  .opt .em { font-size: clamp(56px, 15vw, 110px); line-height:1; }
  .opt.no { opacity:.3; }
  .opt.yes, .opt.hint { box-shadow: 0 0 0 6px var(--accent), 0 10px 20px rgba(0,0,0,.08); }
  .opt.yes { transform: scale(1.08); }
  .glyph { font-size: clamp(60px, 16vw, 112px); color:var(--purple); font-weight:600; line-height:1; }
  .tile .glyph { font-size:46px; }

  /* I Spy */
  .scene { position:relative; width:100%; height:100%; border-radius:26px; overflow:hidden; box-shadow: 0 5px 0 var(--soft); }
  .scene > svg { position:absolute; inset:0; width:100%; height:100%; }
  .scene .opt { position:absolute; width:auto; height:auto; min-width:80px; min-height:80px; padding:4px; border-radius:50%; background:none; box-shadow:none;
    transform:translate(-50%, -50%); font-size: clamp(38px, min(10vw, 7vh), 80px); line-height:1; filter: drop-shadow(0 3px 2px rgba(0,0,0,.15)); }
  .scene.dense .opt { font-size: clamp(32px, min(8.5vw, 6vh), 68px); }
  .scene .opt.yes { transform:translate(-50%, -50%) scale(1.2); }
  .scene .opt.found { background:rgba(255,255,255,.75); box-shadow:0 0 0 4px var(--accent); }

  /* Counting */
  .count .opt { width: clamp(84px, 20vw, 140px); height: clamp(84px, 20vw, 140px); position:relative; }
  .count .opt.done .em { opacity:.3; }
  .count .opt.sel { box-shadow: 0 0 0 6px var(--purple); }
  .count .opt .n { position:absolute; font-size: clamp(34px, 8vw, 56px); font-weight:600; color:var(--accent); }
  .field { position:relative; width:100%; flex:1; min-height:0; border-radius:26px; background:#FFFDF7; box-shadow: 0 5px 0 var(--soft); }
  .field .opt { position:absolute; transform:translate(-50%, -50%); width:auto; height:auto; min-width:74px; min-height:74px; background:none; box-shadow:none; border-radius:50%; }
  .field .opt .em { font-size: clamp(36px, min(9vw, 7vh), 80px); }
  .field .opt .n { font-size: clamp(26px, 6vw, 40px); }
  .numbers { display:flex; gap:16px; justify-content:center; margin-top:10px; }
  .numbers .opt { width:96px; height:96px; }
  .numbers .glyph { font-size:60px; }
  .check { width:110px; height:110px; font-size:56px; border-radius:50%; }

  /* Puzzle */
  .puzzle { width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  .board { position:relative; background:#fff; border-radius:14px; box-shadow:0 5px 0 var(--soft); }
  .board img { display:block; width:100%; height:100%; opacity:.16; border-radius:14px; }
  .tray { display:flex; flex-wrap:wrap; justify-content:center; align-content:flex-start; gap:8px; }
  .piece { background-color:#fff; border-radius:8px; box-shadow:0 3px 0 var(--soft), 0 0 0 1px rgba(0,0,0,.04); touch-action:none; }
  .piece.drag { position:fixed; z-index:5; box-shadow:0 10px 22px rgba(0,0,0,.18); }
  .piece.placed { position:absolute; border-radius:0; box-shadow:none; }

  /* Tracing */
  .trace { touch-action:none; }

  /* Colouring */
  .colorer { width:100%; display:flex; align-items:center; justify-content:center; gap:16px; }
  .choose { display:grid; gap:16px; }
  .pick { padding:12px; display:flex; align-items:center; justify-content:center; }
  .pick img, .pick canvas { width:100%; height:100%; }
  .pick .em { font-size:80px; }
  .paper { position:relative; background:#fff; border-radius:16px; box-shadow:0 5px 0 var(--soft); overflow:hidden; touch-action:none; }
  .paper canvas { position:absolute; inset:0; width:100%; height:100%; }
  .palette { display:grid; gap:10px; }
  .crayon { border-radius:50%; box-shadow: inset 0 -6px 0 rgba(0,0,0,.15), 0 3px 0 var(--soft); }
  .crayon.sel { box-shadow: inset 0 -6px 0 rgba(0,0,0,.15), 0 0 0 5px #fff, 0 0 0 9px var(--ink); }

  /* Grown-ups */
  .panel { width:100%; max-width:520px; padding:24px; font-size:18px; text-align:left; }
  .panel h2 { margin:0 0 12px; font-size:24px; font-weight:600; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 18px; }
  .chip { padding:12px 18px; border-radius:14px; background:var(--soft); font-size:18px; min-width:64px; }
  .chip.sel { background:var(--accent); color:#fff; }
  .wide { width:100%; padding:16px; border-radius:16px; background:var(--accent); color:#fff; font-size:20px; margin-top:8px; }
  .wide.alt { background:var(--soft); color:var(--ink); }
  .note { font-size:15px; opacity:.75; line-height:1.4; }
  .grown { font-size:16px; opacity:.5; padding:12px; }
  .night { position:fixed; inset:0; background: linear-gradient(#2E3A6E, #5B4B8A); z-index:-1; }
  .night ~ .center, .night ~ .grown { color:#fff; }

  /* Phone held sideways: put the question up beside Home so the game gets the height. */
  @media (max-height: 500px) {
    #app { position:relative; }
    .dots { display:none; }
    .prompt { position:absolute; top:max(16px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%); margin:0; max-width:calc(100% - 280px);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .scene .opt, .field .opt { min-width:70px; min-height:70px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="art.js"></script>
<script>
/* ---------- storage (never required to work) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('ll_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ll_' + k, JSON.stringify(v)); } catch {} }
};
let settings = store.get('settings', { minutes: 15, sound: true });
let session = store.get('session', { used: 0, last: 0, locked: false });
let levels = store.get('levels', {});  // per game, 1–3; adjusts itself after each round (never shown to her)
// A long break (1 h+) starts a fresh session, unless a parent hasn't unlocked yet.
if (!session.locked && Date.now() - session.last > 3600e3) session.used = 0;

/* ---------- helpers ---------- */
const app = document.getElementById('app');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const pick = a => a[Math.random() * a.length | 0];
const cap = s => s[0].toUpperCase() + s.slice(1);
const rand = (lo, hi) => lo + (Math.random() * (hi - lo + 1) | 0);

// queue = true lets counting finish "one, two, three" instead of cutting each number off.
let talking = false, lastU = null;  // talking: the latest line hasn't finished yet
function say(text, queue) {
  if (!settings.sound || !('speechSynthesis' in window)) return;
  if (!queue && speechSynthesis.speaking) speechSynthesis.cancel();  // cancelling when idle can drop the next line on older iOS
  // TTS reads a lone "A" as "uh"
  const u = new SpeechSynthesisUtterance(text.replace(/\bA\b/g, 'ay').replace(/\blittle a\b/g, 'little ay'));
  u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.1;
  u.onend = u.onerror = () => { if (u === lastU) talking = false; };
  lastU = u; talking = true;
  speechSynthesis.speak(u);
}

/* ---------- content ---------- */
const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const COLORS = [['red', '#E5534B'], ['blue', '#4A90D9'], ['yellow', '#F2C94C'], ['green', '#58B368'], ['orange', '#F2994A'], ['purple', '#9B6BCC']];
// Regular polygon with n corners (rot = angle of the first corner, degrees).
const ngon = (n, rot = -90) => `<polygon points="${Array.from({ length: n }, (_, i) => { const a = (rot + i * 360 / n) * Math.PI / 180;
  return `${(50 + 46 * Math.cos(a)).toFixed(1)},${(50 + 46 * Math.sin(a)).toFixed(1)}`; }).join(' ')}"/>`;
const SHAPES = {
  circle: '<circle cx="50" cy="50" r="42"/>',
  square: '<rect x="10" y="10" width="80" height="80" rx="6"/>',
  triangle: '<polygon points="50,8 94,90 6,90"/>',
  star: '<polygon points="50,6 62,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 38,38"/>',
  heart: '<path d="M50 88C20 66 6 50 6 32 6 18 17 8 30 8c10 0 16 6 20 14 4-8 10-14 20-14 13 0 24 10 24 24 0 18-14 34-44 56z"/>',
  diamond: '<polygon points="50,4 90,50 50,96 10,50"/>',
  oval: '<ellipse cx="50" cy="50" rx="44" ry="30"/>',
  rectangle: '<rect x="4" y="24" width="92" height="52" rx="6"/>',
  pentagon: ngon(5), hexagon: ngon(6, 0), octagon: ngon(8, 22.5),
  trapezoid: '<polygon points="28,22 72,22 96,80 4,80"/>',
  parallelogram: '<polygon points="30,24 96,24 70,76 4,76"/>',
  semicircle: '<path d="M4 74 A46 46 0 0 1 96 74 Z"/>',
  crescent: '<path d="M62 8 A44 44 0 1 0 62 92 A48 48 0 0 1 62 8 Z"/>'
};
const SIDES = { triangle: 3, square: 4, rectangle: 4, diamond: 4, trapezoid: 4, parallelogram: 4, pentagon: 5, hexagon: 6, octagon: 8 };
// Shapes that are easy to mix up; used as the wrong answers once she's ready, so she has to really look.
const LOOKALIKES = [['pentagon', 'hexagon', 'octagon', 'circle'], ['square', 'rectangle', 'trapezoid', 'parallelogram', 'diamond'],
  ['circle', 'oval', 'semicircle', 'crescent'], ['star', 'heart', 'triangle', 'pentagon']];
let svgId = 0;
// Glossy toy-like shape: the colour plus a soft highlight clipped to the shape.
const svg = (name, fill) => { const id = 'c' + svgId++;
  return `<svg viewBox="0 0 100 100"><defs><clipPath id="${id}">${SHAPES[name]}</clipPath></defs><g fill="${fill}">${SHAPES[name]}</g>
    <ellipse cx="34" cy="26" rx="34" ry="20" fill="#fff" opacity=".3" clip-path="url(#${id})"/></svg>`; };
const ANIMALS = [['🐄', 'moo', 'cow'], ['🐶', 'woof', 'dog'], ['🐱', 'meow', 'cat'], ['🦆', 'quack', 'duck'], ['🐑', 'baa', 'sheep'],
  ['🐷', 'oink', 'pig'], ['🦁', 'roar', 'lion'], ['🐸', 'ribbit', 'frog'], ['🐔', 'cluck', 'hen'], ['🐴', 'neigh', 'horse'], ['🦉', 'hoo hoo', 'owl'],
  ['🐝', 'buzz', 'bee'], ['🐒', 'ooh ooh ah ah', 'monkey'], ['🐭', 'squeak', 'mouse'], ['🐍', 'hiss', 'snake'], ['🐺', 'howl', 'wolf'], ['🐘', 'toot', 'elephant']];
const THINGS = ['🍎', '🐟', '⭐', '🚗', '🐞', '🌸', '🍌', '🎈', '🐥', '⚽', '🍓', '🦋'];

// Capital letters as finger strokes on a 100×100 grid, in writing order and direction. arc(): degrees, 0 = right, 90 = down.
const arc = (cx, cy, rx, ry, a0, a1, n = 14) => Array.from({ length: n + 1 }, (_, i) => {
  const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)];
});
const P_BOWL = [[28, 10], [52, 10], ...arc(52, 31, 20, 21, -90, 90), [28, 52]];
const O_RING = arc(50, 50, 30, 40, -90, -450, 28);
const LETTERS = {
  A: [[[50, 10], [20, 90]], [[50, 10], [80, 90]], [[33, 60], [67, 60]]],
  B: [[[28, 10], [28, 90]], [[28, 10], [52, 10], ...arc(52, 29, 18, 19, -90, 90), [28, 48]], [[28, 48], [55, 48], ...arc(55, 69, 21, 21, -90, 90), [28, 90]]],
  C: [arc(52, 50, 30, 40, -45, -315, 24)],
  D: [[[28, 10], [28, 90]], [[28, 10], [42, 10], ...arc(42, 50, 32, 40, -90, 90, 20), [28, 90]]],
  E: [[[28, 10], [28, 90]], [[28, 10], [72, 10]], [[28, 50], [64, 50]], [[28, 90], [72, 90]]],
  F: [[[28, 10], [28, 90]], [[28, 10], [72, 10]], [[28, 50], [62, 50]]],
  G: [arc(52, 50, 30, 40, -45, -360, 24), [[82, 50], [58, 50]]],
  H: [[[25, 10], [25, 90]], [[75, 10], [75, 90]], [[25, 50], [75, 50]]],
  I: [[[50, 10], [50, 90]], [[32, 10], [68, 10]], [[32, 90], [68, 90]]],
  J: [[[65, 10], [65, 68], ...arc(47, 68, 18, 22, 0, 180)]],
  K: [[[28, 10], [28, 90]], [[72, 10], [28, 56]], [[42, 42], [74, 90]]],
  L: [[[30, 10], [30, 90], [72, 90]]],
  M: [[[20, 90], [20, 10], [50, 60], [80, 10], [80, 90]]],
  N: [[[25, 90], [25, 10], [75, 90], [75, 10]]],
  O: [O_RING],
  P: [[[28, 10], [28, 90]], P_BOWL],
  Q: [O_RING, [[58, 70], [80, 92]]],
  R: [[[28, 10], [28, 90]], P_BOWL, [[45, 52], [74, 90]]],
  S: [[...arc(50, 30, 22, 20, -30, -270), ...arc(50, 70, 22, 20, -90, 150)]],
  T: [[[20, 10], [80, 10]], [[50, 10], [50, 90]]],
  U: [[[25, 10], ...arc(50, 60, 25, 30, 180, 0), [75, 10]]],
  V: [[[20, 10], [50, 90], [80, 10]]],
  W: [[[12, 10], [30, 90], [50, 30], [70, 90], [88, 10]]],
  X: [[[22, 10], [78, 90]], [[78, 10], [22, 90]]],
  Y: [[[22, 10], [50, 50], [78, 10]], [[50, 50], [50, 90]]],
  Z: [[[22, 10], [78, 10], [22, 90], [78, 90]]]
};
// Little letters: top line y=8, middle line y=42, base line y=78, tails to y=98.
const DOT_AT = (x, y) => [[x, y], [x, y + 1]];
const LOWER = {
  A: [arc(46, 60, 16, 18, -20, -380), [[62, 42], [62, 78]]],
  B: [[[30, 8], [30, 78]], arc(46, 60, 16, 18, 180, 540)],
  C: [arc(50, 60, 18, 18, -40, -320)],
  D: [arc(50, 60, 16, 18, -20, -380), [[66, 8], [66, 78]]],
  E: [[[34, 60], [66, 60], ...arc(50, 60, 16, 18, 0, -310)]],
  F: [[...arc(58, 20, 10, 12, -20, -180), [48, 78]], [[36, 42], [62, 42]]],
  G: [arc(48, 58, 15, 16, -20, -380), [[63, 42], [63, 88], ...arc(50, 88, 13, 10, 0, 160)]],
  H: [[[30, 8], [30, 78]], [[30, 58], ...arc(46, 58, 16, 16, 180, 360), [62, 78]]],
  I: [[[50, 42], [50, 78]], DOT_AT(50, 26)],
  J: [[[56, 42], [56, 90], ...arc(44, 90, 12, 8, 0, 170)], DOT_AT(56, 26)],
  K: [[[32, 8], [32, 78]], [[62, 42], [32, 64]], [[42, 57], [64, 78]]],
  L: [[[50, 8], [50, 78]]],
  M: [[[24, 42], [24, 78]], [[24, 56], ...arc(36, 54, 12, 12, 180, 360), [48, 78]], [[48, 56], ...arc(60, 54, 12, 12, 180, 360), [72, 78]]],
  N: [[[30, 42], [30, 78]], [[30, 58], ...arc(46, 58, 16, 16, 180, 360), [62, 78]]],
  O: [arc(50, 60, 17, 18, -90, -450, 24)],
  P: [[[32, 42], [32, 98]], arc(48, 60, 16, 18, 180, 540)],
  Q: [arc(50, 60, 16, 18, -20, -380), [[66, 42], [66, 98]]],
  R: [[[34, 42], [34, 78]], [[34, 56], ...arc(48, 54, 14, 12, 180, 320)]],
  S: [[...arc(50, 51, 13, 9, -30, -270), ...arc(50, 69, 13, 9, -90, 150)]],
  T: [[[48, 16], [48, 70], ...arc(58, 70, 10, 8, 180, 90)], [[36, 40], [62, 40]]],
  U: [[[32, 42], [32, 62], ...arc(47, 62, 15, 16, 180, 0)], [[62, 42], [62, 78]]],
  V: [[[30, 42], [50, 78], [70, 42]]],
  W: [[[22, 42], [34, 78], [50, 50], [66, 78], [78, 42]]],
  X: [[[32, 42], [68, 78]], [[68, 42], [32, 78]]],
  Y: [[[32, 42], [50, 74]], [[68, 42], [40, 98]]],
  Z: [[[32, 42], [68, 42], [32, 78], [68, 78]]]
};
const WORDS = { A: ['apple', '🍎'], B: ['ball', '⚽'], C: ['cat', '🐱'], D: ['dog', '🐶'], E: ['elephant', '🐘'], F: ['fish', '🐟'],
  G: ['grapes', '🍇'], H: ['house', '🏠'], I: ['ice cream', '🍦'], J: ['juice', '🧃'], K: ['kite', '🪁'], L: ['lion', '🦁'],
  M: ['moon', '🌙'], N: ['nest', '🪺'], O: ['orange', '🍊'], P: ['pig', '🐷'], Q: ['queen', '👸'], R: ['rainbow', '🌈'],
  S: ['sun', '☀️'], T: ['tree', '🌳'], U: ['umbrella', '☂️'], V: ['violin', '🎻'], W: ['whale', '🐳'], X: ['fox', '🦊'],
  Y: ['yo-yo', '🪀'], Z: ['zebra', '🦓'] };
const letterPraise = L => L === 'X' ? 'X! Fox ends with X!' : `${L}! ${L} is for ${WORDS[L][0]}!`;

// Each make(level) returns one question: id (avoids repeats), prompt (spoken), optional show (what the bubble displays),
// praise, reveal (shown on success), find (real-world line at the end), and options. Level 1 = gentle, 3 = stretch.
const GAMES = {
  letters: { title: 'Trace', icon: '<b class="glyph">Aa</b>', tint: '#FFE0EA', shade: '#F3BFD0', trace: true, make(level) {
    const L = pick(ALPHA), lower = level >= 3 && Math.random() < 0.6;
    const name = lower ? `little ${L.toLowerCase()}` : level >= 3 ? `big ${L}` : `letter ${L}`;
    return { id: L + lower, lower, strokes: (lower ? LOWER : LETTERS)[L], radius: [12, 9, 7.5][level - 1], keep: level === 1,
      prompt: `Trace the ${name}. Start at the green dot.`, show: `Trace the ${name}`, praise: letterPraise(L),
      reveal: `${lower ? L.toLowerCase() : L} ${WORDS[L][1]}`, find: `Can you draw a big ${L} in the air with your finger?` };
  } },
  hunt: { title: 'Find the Letter', icon: '🔍', tint: '#DCEBFF', shade: '#B8D3F5', make(level) {
    const n = [3, 4, 6][level - 1], kind = pick([['find'], ['find', 'first', 'first'], ['first', 'little', 'match']][level - 1]);
    let L = pick(ALPHA); if (kind === 'first') while (L === 'X') L = pick(ALPHA);
    const [word, emoji] = WORDS[L], lowerOpts = kind === 'little' || kind === 'match';
    // Little letters that look alike (b d p q) are deliberately put together.

    const opts = shuffle([L, ...[...pool, ...shuffle(ALPHA)].filter((x, i, a) => x !== L && a.indexOf(x) === i).slice(0, n - 1)]);
    const glyph = o => lowerOpts ? o.toLowerCase() : o;

      first: [`What letter does ${word} start with?`, `<span class="pic">${emoji}</span> ${cap(word)} starts with…`],
      little: [`Find the little ${L.toLowerCase()}.`, `Find the little ${L.toLowerCase()}`],
      match: [`Find the little letter that goes with big ${L}.`, `Find the little one for <b class="glyph" style="font-size:1.3em">${L}</b>`] }[kind];
    return { id: L + kind, prompt: q[0], show: q[1], praise: letterPraise(L), reveal: `${L}${L.toLowerCase()} ${emoji}`,
      find: `Can you find the letter ${L} in a book or on a sign?`, many: n > 4,
      options: opts.map(o => ({ html: `<b class="glyph">${glyph(o)}</b>`, correct: o === L })) };
  } },
  puzzle: { title: 'Puzzle', icon: '🧩', tint: '#FFEBC9', shade: '#F2D29C', puzzle: true, rounds: 3, make(level) {
    const L = pick(ALPHA.filter(l => l !== 'X')), [word, emoji] = WORDS[L];
    return { id: L, L, emoji, grid: [[3, 2], [3, 3], [4, 3]][level - 1], guide: level < 3,
      prompt: 'Put the puzzle together!', praise: letterPraise(L), reveal: `${L} is for ${word}`, find: `Can you say it? ${L}, ${L}, ${word}!` };
  } },
  seek: { title: 'I Spy', icon: '👀', tint: '#DDF3E0', shade: '#B6E0BD', seek: true, size: level => [12, 16, 20][level - 1], make(level) {
    const left = cur.scene.filter(o => !cur.found.includes(o.L));
    const byLetter = level === 3 || (level === 2 && Math.random() < 0.5);
    const t = pick(byLetter ? left.filter(o => o.L !== 'X') : left), [word, emoji] = WORDS[t.L];
    return { id: t.L, byLetter, prompt: byLetter ? `Find something that starts with ${t.L}.` : `Can you find the ${word}?`,
      reveal: `${t.L} ${emoji}`, find: 'Can you spy something that starts with B in this room?',
      praise: byLetter ? `Yes! ${cap(word)} starts with ${t.L}!` : t.L === 'X' ? 'You found the fox!' : `You found the ${word}! ${cap(word)} starts with ${t.L}.`,
      options: cur.scene.map(o => ({ html: WORDS[o.L][1], name: WORDS[o.L][0], L: o.L, correct: o === t, found: cur.found.includes(o.L) })) };
  } },
  colorshape: { title: 'Colors & Shapes', icon: svg('star', '#F2C94C'), tint: '#FFF4C2', shade: '#F0DE8E', make(level) {
    const all = Object.keys(SHAPES), shapes = level === 1 ? all.slice(0, 8) : all, n = [4, 6, 8][level - 1];
    if (level === 3 && Math.random() < 0.4) {  // count the sides; no other option has that many
      const s = pick(['triangle', 'pentagon', 'hexagon', 'octagon']), k = SIDES[s];
      const opts = [s, ...sample(shapes.filter(x => x !== s && SIDES[x] !== k), n - 1)];

    }

    const another = () => fam.length && Math.random() < 0.6 ? pick(fam) : pick(shapes.filter(x => x !== s));

    while (opts.length < n) { const o = [pick(COLORS), another()]; if (!opts.some(p => key(p) === key(o))) opts.push(o); }
    return { id: c[0] + s, prompt: `Find the ${c[0]} ${s}.`, praise: `Yes! The ${c[0]} ${s}!`, find: `Can you find something ${c[0]} near you?`, many: n > 4,
      options: shuffle(opts).map(([oc, os]) => ({ html: svg(os, oc[1]), correct: oc === c && os === s })) };
  } },
  counting: { title: 'Counting', icon: '🖐️', tint: '#EAE1FF', shade: '#CDBEF2', count: true, make(level) {
    const thing = pick(THINGS);
    if (level === 1) { const n = rand(3, 10); return { id: n, n, thing, mode: 'tap', prompt: 'Tap each one to count!', praise: `${n}! You counted ${n}!`, reveal: String(n), find: 'Can you count your toes?' }; }
    if (level === 2) { const n = rand(5, 12); return { id: n, n, thing, mode: 'howmany', prompt: 'Count them. How many are there?', praise: `Yes! There are ${n}!`, reveal: String(n), find: 'Can you count the chairs in this room?' }; }
    const n = rand(4, 12);
    return { id: n, n, thing, mode: 'give', prompt: `Tap exactly ${n}. Then press the green tick.`, show: `Tap exactly <b class="glyph" style="font-size:1.2em">${n}</b>`,
      praise: `Yes! That's ${n}!`, reveal: String(n), find: `Can you bring me ${n} toys?` };
  } },
  color: { title: 'Coloring', icon: '🖍️', tint: '#FFE2D2', shade: '#F3C2A8', color: true, rounds: 2, make() {
    const choices = [...sample(Object.keys(ART), 2), 'letter:' + pick(ALPHA), 'blank'];
    return { id: Math.random(), choices, prompt: 'Pick a picture to color!', find: 'Can you show a grown-up your pictures?' };
  } },
  animals: { title: 'Animals', icon: '🐄', tint: '#DDF2F6', shade: '#B4DDE6', make(level) {
    const n = [3, 4, 6][level - 1], t = pick(ANIMALS), [, sound, name] = t, byLetter = level === 3 && Math.random() < 0.5;
    const others = ANIMALS.filter(a => a !== t && (!byLetter || a[2][0] !== name[0]));  // only one can start with the letter
    const opts = shuffle([t, ...sample(others, n - 1)]), L = name[0].toUpperCase();
    return { id: name, many: n > 4, prompt: byLetter ? `Which animal starts with ${L}?` : `Who says ${sound}?`,
      praise: byLetter ? `Yes! ${cap(name)} starts with ${L}!` : `Yes! The ${name} says ${sound}!`, find: `Can you say ${sound}, like a ${name}?`,
      options: opts.map(a => ({ html: `<span class="em">${a[0]}</span>`, name: a[2], correct: a === t })) };

/* ---------- session timer (rule 1) ---------- */
let screen = 'home';
function save() { store.set('session', session); }
function timeUp() { return session.used >= settings.minutes * 60; }
let lastTick = Date.now();
setInterval(() => {
  const now = Date.now(), dt = Math.min(now - lastTick, 15000) / 1000; lastTick = now;  // capped so app suspensions don't count
  if (document.hidden || session.locked) return;
  session.used += dt; session.last = now;
  // Lock (and save) right away; the rest screen shows between questions so nothing is cut off mid-way.
  if (timeUp()) {
    session.locked = true;
    if (screen === 'home' || screen === 'done') showRest();
    else if (screen === 'game' && GAMES[cur.key].color && !cur.warned) {  // colouring never "ends", so: one minute's warning, then rest
      cur.warned = true; say('One more minute to finish your picture!');
      setTimeout(() => { if (screen === 'game') showRest(); }, 60000);
    }
  }
  save();
}, 5000);

/* ---------- screens ---------- */
function showHome() {
  clearTimeout(pending);
  if (session.locked || timeUp()) return showRest();
  screen = 'home';
  app.innerHTML = `<h1>Let's <span>play!</span></h1><div class="tiles">${Object.entries(GAMES).map(([k, g]) =>
    `<button class="tile" data-g="${k}" style="--tint:${g.tint};--shade:${g.shade}"><span class="ic">${g.icon}</span>${g.title}</button>`).join('')}</div>
    <button class="gear" aria-label="Grown-ups">⚙️</button>`;
  app.querySelectorAll('.tile').forEach(b => b.onclick = () => startGame(b.dataset.g));
  app.querySelector('.gear').onclick = () => showGate(showSettings);
}

let cur = null, busy = false, pending = 0;
const later = (fn, ms) => { clearTimeout(pending); pending = setTimeout(fn, ms); };  // one pending step; Home cancels it
// Next question only once the praise has finished being spoken (otherwise iOS cuts it off), then a short pause.
function advance(ms = 900) {
  const until = Date.now() + 7000;  // safety net if a device never reports the end of speech
  later(function wait() { if (talking && settings.sound && Date.now() < until) later(wait, 200); else later(nextQ, 500); }, ms);
}
function miss() { cur.missTotal++; }
function startGame(key) { cur = { key, q: 0, prev: null, missTotal: 0, level: levels[key] || 2 }; nextQ(); }

function nextQ() {
  busy = false;
  if (session.locked || timeUp()) return showRest();
  const g = GAMES[cur.key], rounds = g.rounds || 5;
  if (cur.q >= rounds) return showDone();
  if (g.seek && !cur.scene) { cur.scene = sample(ALPHA, g.size(cur.level)).map(L => ({ L })); cur.found = []; }  // one scene per round
  let item; do { item = g.make(cur.level); } while (item.id === cur.prev);
  cur.q++; cur.prev = item.id; cur.item = item;
  render();
  say(cur.q === 1 ? `${g.title}! ${item.prompt}` : item.prompt);  // first question also names the game (she can't read the tiles)
}

// Draws the current question. Re-run on rotation so it fits the new screen (that one question restarts).
function render() {
  const g = GAMES[cur.key], rounds = g.rounds || 5, item = cur.item;
  cur.misses = 0; screen = 'game';
  const dots = Array.from({ length: rounds }, (_, i) => `<span class="dot ${i < cur.q ? 'on' : ''}"></span>`).join('');
  const right = g.color && item.page ? '<button class="home done-btn" aria-label="Finished">✅</button>'
    : g.puzzle && !item.guide ? '<span class="ref"></span>' : '<span style="width:90px"></span>';
  const body = g.color ? '<div class="colorer"></div>' : g.seek ? '<div class="scene"></div>' : g.puzzle ? '<div class="puzzle"></div>'
    : g.trace ? '<canvas class="trace"></canvas>' : g.count ? '' : item.options.map((o, i) => `<button class="opt card" data-i="${i}">${o.html}</button>`).join('');
  app.innerHTML = `<div class="bar"><button class="home" aria-label="Home">🏠</button><div class="dots">${dots}</div>${right}</div>
    <button class="prompt">${item.show || item.prompt}</button><div class="opts ${g.count ? 'count' : ''} ${item.many ? 'many' : ''}">${body}</div>`;
  app.querySelector('.home').onclick = showHome;
  app.querySelector('.prompt').onclick = () => say(item.prompt);
  if (g.trace) setupTrace(app.querySelector('.trace'), item);
  if (g.puzzle) setupPuzzle(app.querySelector('.puzzle'), item);
  if (g.color) setupColor(app.querySelector('.colorer'), item);
  if (g.seek) setupScene(app.querySelector('.scene'), item);
  if (g.count) setupCount(app.querySelector('.opts'), item);
  const done = app.querySelector('.done-btn');
  if (done) done.onclick = () => { if (busy) return; busy = true; app.querySelector('.prompt').textContent = 'Beautiful!'; say('Beautiful! Show a grown-up!'); advance(1500); };
  if (!g.seek && !g.count) app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b));
}
let resizeT, lastW = innerWidth;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (Math.abs(innerWidth - lastW) < 40) return;  // ignore iOS toolbar show/hide; only real rotations redraw
    lastW = innerWidth;
    if (screen === 'game' && !busy) render();
  }, 300);
});
// Belt and braces for iOS Safari: stop the page itself from panning while she drags pieces, traces or colours.
document.addEventListener('touchmove', e => { if (e.target.closest && e.target.closest('.piece, .trace, .paper')) e.preventDefault(); }, { passive: false });

function success(text) {
  busy = true;
  if (text) app.querySelector('.prompt').textContent = text;
  say(cur.item.praise); advance();
}

function answer(b) {
  if (busy || b.classList.contains('no')) return;
  const item = cur.item, o = item.options[b.dataset.i];
  if (o.correct) {
    b.classList.add('yes');
    if (cur.found) cur.found.push(item.id);
    success(item.reveal);
  } else {
    // A wrong tap still teaches: it names what she tapped (and, when hunting by letter, its first letter).
    b.classList.add('no'); miss();
    say(o.name ? `That's the ${o.name}.${item.byLetter && o.L !== 'X' ? ` ${cap(o.name)} starts with ${o.L}.` : ''}` : 'Try again.');
    if (++cur.misses >= 2) app.querySelectorAll('.opt').forEach(x => { if (item.options[x.dataset.i]?.correct) x.classList.add('hint'); });
  }

/* ---------- I Spy: an illustrated park with pictures spread on a grid (never overlapping) ---------- */
const PARK = `<svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice"><defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE3FA"/><stop offset="1" stop-color="#EAF6FF"/></linearGradient>
  <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE5A6"/><stop offset="1" stop-color="#A6D78C"/></linearGradient>
  <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ED68A"/><stop offset="1" stop-color="#7EC46E"/></linearGradient></defs>
  <rect width="400" height="600" fill="url(#sky)"/><circle cx="330" cy="70" r="46" fill="#FFE07A" opacity=".9"/><circle cx="330" cy="70" r="64" fill="#FFE07A" opacity=".25"/>
  <g fill="#fff" opacity=".9"><ellipse cx="80" cy="80" rx="46" ry="18"/><ellipse cx="110" cy="66" rx="30" ry="20"/><ellipse cx="220" cy="130" rx="40" ry="14"/><ellipse cx="244" cy="120" rx="24" ry="15"/></g>
  <path d="M0 260 Q 100 200 210 250 T 400 230 V600 H0Z" fill="url(#h1)"/><path d="M0 360 Q 120 300 240 350 T 400 330 V600 H0Z" fill="url(#h2)"/>
  <path d="M170 600 C 190 520 260 470 230 400 C 215 365 250 350 270 340" stroke="#F3E3C3" stroke-width="34" fill="none" stroke-linecap="round" opacity=".9"/>
  <g fill="#fff" opacity=".7"><circle cx="40" cy="430" r="4"/><circle cx="90" cy="520" r="4"/><circle cx="330" cy="470" r="4"/><circle cx="360" cy="560" r="4"/><circle cx="300" cy="300" r="3"/></g></svg>`;
function setupScene(box, item) {
  const scene = cur.scene, wide = innerWidth > innerHeight;
  if (scene.wide !== wide) {  // lay out once per round, or again if the screen rotates
    scene.wide = wide;
    const n = scene.length, cols = n <= 12 ? (wide ? 5 : 3) : n <= 16 ? (wide ? 5 : 4) : (wide ? 6 : 4), rows = Math.ceil((n <= 12 ? 15 : n <= 16 ? 20 : 24) / cols);
    const cells = shuffle([...Array(cols * rows).keys()]);
    scene.forEach((o, k) => {
      o.x = (cells[k] % cols + 0.5 + (Math.random() - 0.5) * 0.2) * 100 / cols;
      o.y = ((cells[k] / cols | 0) + 0.5 + (Math.random() - 0.5) * 0.2) * 100 / rows;
    });
  }
  box.classList.toggle('dense', scene.length > 12);
  box.innerHTML = PARK + item.options.map((o, i) =>
    `<button class="opt ${o.found ? 'found' : ''}" data-i="${i}" style="left:${scene[i].x}%;top:${scene[i].y}%">${o.html}</button>`).join('');
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b));
}

/* ---------- Counting: tap to count (1), count then pick the number (2), count out exactly N (3) ---------- */
function setupCount(box, item) {
  const scatter = item.mode !== 'tap', total = item.mode === 'give' ? Math.min(15, item.n + rand(3, 5)) : item.n;
  let html = Array.from({ length: total }, () => `<button class="opt ${scatter ? '' : 'card'}"><span class="em">${item.thing}</span></button>`).join('');
  if (scatter) { html = `<div class="field">${html}</div>`; box.style.flexFlow = 'column nowrap'; }
  box.innerHTML = html + (item.mode === 'give' ? '<div class="numbers"><button class="check card" aria-label="Check">✅</button></div>' : '');
  const btns = [...box.querySelectorAll('.field .opt, :scope > .opt')];
  if (scatter) {  // spread over a grid so nothing overlaps, but not in neat rows (harder to count)
    const field = box.querySelector('.field'), wide = field.clientWidth > field.clientHeight, cols = wide ? 5 : 4, rows = Math.ceil(16 / cols);
    const cells = shuffle([...Array(cols * rows).keys()]);
    btns.forEach((b, k) => { b.style.left = (cells[k] % cols + 0.5 + (Math.random() - 0.5) * 0.3) * 100 / cols + '%';
      b.style.top = ((cells[k] / cols | 0) + 0.5 + (Math.random() - 0.5) * 0.3) * 100 / rows + '%'; });
  }
  let counted = 0;
  btns.forEach(b => b.onclick = () => {
    if (busy) return;
    if (item.mode === 'give') {  // toggle; she decides when she has exactly n
      b.classList.toggle('sel'); counted = box.querySelectorAll('.opt.sel').length; say(String(counted), true); return;
    }
    if (b.classList.contains('done')) return;
    b.classList.add('done'); b.insertAdjacentHTML('beforeend', `<span class="n">${++counted}</span>`);
    if (counted < item.n) return say(String(counted), true);
    if (item.mode === 'tap') { busy = true; app.querySelector('.prompt').textContent = item.reveal; say(item.praise, true); return advance(); }
    say(String(counted), true); say('How many are there?', true);  // she has to know the last number is the answer
    const nums = shuffle([item.n, item.n + pick([1, 2]), item.n - pick([1, 2])]);
    box.insertAdjacentHTML('beforeend', `<div class="numbers">${nums.map(v => `<button class="opt card num" data-v="${v}"><b class="glyph">${v}</b></button>`).join('')}</div>`);
    box.querySelectorAll('.num').forEach(nb => nb.onclick = () => {
      if (busy || nb.classList.contains('no')) return;
      if (+nb.dataset.v === item.n) { nb.classList.add('yes'); success(item.reveal); } else { nb.classList.add('no'); miss(); say('Try again.'); }
    });
  });
  const check = box.querySelector('.check');
  if (check) check.onclick = () => {
    if (busy) return;
    if (counted === item.n) return success(item.reveal);
    miss(); say(`You have ${counted}. We need ${item.n}. Let's try again.`);
    box.querySelectorAll('.opt.sel').forEach(o => o.classList.remove('sel')); counted = 0;
  };
}

/* ---------- Tracing: follow each stroke from the green dot in the writing direction ---------- */
function setupTrace(cv, item) {

  cv.style.width = cv.style.height = S + 'px'; cv.width = cv.height = S * dpr;

  ctx.scale(dpr * S / 100, dpr * S / 100); ctx.lineCap = ctx.lineJoin = 'round';

    const samples = [];  // a point every ~2.5 units along the stroke
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 2.5));
      for (let j = i > 1 ? 1 : 0; j <= n; j++) samples.push([x0 + (x1 - x0) * j / n, y0 + (y1 - y0) * j / n]);

  const line = (pts, color, w) => { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); };

    const s = strokes[si];

    if (s.idx > 0) line(s.samples.slice(0, s.idx + 1), '#8E63CE', 13);
    if (ink) line(ink, 'rgba(93,181,138,.55)', 5);

    ctx.fillStyle = '#5DB58A'; ctx.beginPath(); ctx.arc(x, y, 6.5, 0, 7); ctx.fill();

  const at = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100]; };
  const follow = p => {  // move along the stroke only forwards, a little at a time, while the finger stays on it
    const s = strokes[si];
    for (let k = Math.min(s.idx + 4, s.samples.length - 1); k > s.idx; k--) if (near(p, s.samples[k], R)) { s.idx = k; break; }
    if (s.idx >= s.samples.length - 1) {
      s.done = true; si++; ink = null; down = false; draw();  // next line needs a fresh touch (B, G, a… start where the last ended)
      if (si === strokes.length) success(item.reveal);
    }
  };
  let down = false;
  cv.onpointerdown = e => {
    if (busy) return; try { cv.setPointerCapture(e.pointerId); } catch {}
    const p = at(e), s = strokes[si];
    if (!near(p, s.samples[s.idx], R * 1.6)) { say('Start at the green dot.'); return; }
    down = true; ink = [p]; follow(p); draw();
  };
  cv.onpointermove = e => { if (!down || busy) return; const p = at(e); ink && ink.push(p); follow(p); draw(); };
  cv.onpointerup = cv.onpointercancel = () => {
    if (!down) return; down = false;
    const s = strokes[si];
    if (s && !s.done && s.idx > 0 && !item.keep) { s.idx = 0; miss(); say('Oops! Try that line again from the green dot.'); }  // one smooth line, like real writing
    ink = null; draw();
  };
  draw();
}

/* ---------- Puzzle: letter + its picture, cut into a grid; more pieces and no guide as she gets better ---------- */
function setupPuzzle(box, item) {
  const [cols, rows] = item.grid, c = document.createElement('canvas'); c.width = 600; c.height = 400;
  const x = c.getContext('2d'), grad = x.createLinearGradient(0, 0, 600, 400);
  grad.addColorStop(0, '#FFF1F6'); grad.addColorStop(1, '#EAF4FF');
  x.fillStyle = grad; x.fillRect(0, 0, 600, 400); x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '600 290px Fredoka, ui-rounded, sans-serif'; x.lineWidth = 14; x.strokeStyle = '#fff'; x.strokeText(item.L, 165, 215);
  x.fillStyle = '#8E63CE'; x.fillText(item.L, 165, 215);
  x.font = '220px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif'; x.fillText(item.emoji, 440, 215);
  const img = c.toDataURL(), ref = app.querySelector('.ref'); if (ref) ref.style.backgroundImage = `url(${img})`;
  // Board W×H (3:2) and a tray of the same shape: stacked when upright, side by side when the screen is wide and short.
  const bw = box.clientWidth, bh = box.parentElement.clientHeight, wide = bw > bh * 1.3, gx = (cols - 1) * 8, gy = (rows - 1) * 8;
  const W = Math.floor(Math.min(600, wide ? Math.min((bw - 18 - gx) / 2, (bh - gy) * 1.5) : Math.min(bw - gx, (bh - 18 - gy) / 2 * 1.5)));
  const H = W * 2 / 3, w = W / cols, h = H / rows;
  box.style.flexDirection = wide ? 'row' : 'column';
  box.innerHTML = `<div class="board" style="width:${W}px;height:${H}px">${item.guide ? `<img src="${img}" alt="">` : ''}</div>
    <div class="tray" style="width:${W + gx}px;height:${H + gy}px"></div>`;  // fixed size so the board never jumps
  const board = box.querySelector('.board'), tray = box.querySelector('.tray');
  let left = cols * rows;
  shuffle([...Array(cols * rows).keys()]).forEach(i => {
    const col = i % cols, row = i / cols | 0, p = document.createElement('div');
    p.className = 'piece';
    p.style.cssText = `width:${w}px;height:${h}px;background-image:url(${img});background-size:${W}px ${H}px;background-position:-${col * w}px -${row * h}px`;
    tray.appendChild(p);
    // Dragging listens on the whole window (not just the piece), which keeps working on iPad even when the finger outruns the piece.
    p.onpointerdown = e => {
      if (busy || p.dataset.placed || p.classList.contains('drag')) return;
      e.preventDefault();
      const r = p.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top, id = e.pointerId;
      p.classList.add('drag'); p.style.left = r.left + 'px'; p.style.top = r.top + 'px';
      const move = ev => { if (ev.pointerId !== id) return; ev.preventDefault(); p.style.left = ev.clientX - dx + 'px'; p.style.top = ev.clientY - dy + 'px'; };
      const up = ev => {
        if (ev.pointerId !== id) return;
        removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
        const q = p.getBoundingClientRect(), b = board.getBoundingClientRect();  // measure before leaving drag mode
        p.classList.remove('drag');
        if (Math.hypot(q.left - (b.left + col * w), q.top - (b.top + row * h)) < Math.min(w, h) * 0.45) {  // close enough: snap in
          p.dataset.placed = 1; p.classList.add('placed'); board.appendChild(p);
          p.style.left = col * w + 'px'; p.style.top = row * h + 'px';
          if (!--left) success(item.reveal);
        } else {  // gently back to the tray; a soft word only if she was trying on the board
          const cx = q.left + w / 2, cy = q.top + h / 2;
          if (cx > b.left && cx < b.right && cy > b.top && cy < b.bottom) { miss(); say('Try again.'); }
          p.style.left = p.style.top = '';
        }
      };
      addEventListener('pointermove', move, { passive: false }); addEventListener('pointerup', up); addEventListener('pointercancel', up);
    };
  });
}

/* ---------- Colouring: OpenMoji line art (all 26 letters + favourites) and bubble letters ---------- */
const RES = 800;  // drawing resolution
const lineSvg = key => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">${ART[key][1]
  .replace(/stroke="#000(000)?"/g, 'stroke="#3A3330"').replace(/fill="#000(000)?"/g, 'fill="#3A3330"').replace(/stroke-width="2"/g, 'stroke-width="1.7"')}</svg>`;
const svgUrl = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);

// Bubble letter from the tracing strokes: a thick dark line with its middle cut out leaves a hollow letter to colour in.
function bubble(x, L, ox, oy, size) {
  x.save(); x.translate(ox, oy); x.scale(size / 100, size / 100); x.lineJoin = x.lineCap = 'round'; x.strokeStyle = '#3A3330';
  const tube = w => { x.lineWidth = w; LETTERS[L].forEach(p => { x.beginPath(); p.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.stroke(); }); };
  tube(20); x.globalCompositeOperation = 'destination-out'; tube(14.5);
  x.restore();
}
// Calls back with a canvas holding the page's lines (pictures load as images, so this is asynchronous).
function drawPage(key, done) {
  const c = document.createElement('canvas'); c.width = c.height = RES;
  const x = c.getContext('2d');
  if (key === 'blank') return done(c);
  if (key.startsWith('letter:')) { bubble(x, key.slice(7), 80, 80, 640); return done(c); }
  const img = new Image();
  img.onload = () => { x.drawImage(img, 150, 140, 630, 630); bubble(x, ART[key][0], 18, 18, 190); done(c); };
  img.src = svgUrl(lineSvg(key));
}
const pagePrompt = k => k === 'blank' ? 'Draw anything you like!'
  : k.startsWith('letter:') ? `Let's color the letter ${k.slice(7)}! ${k.slice(7)} is for ${WORDS[k.slice(7)][0]}.`
  : `Let's color the ${k}! ${ART[k][0] === 'X' ? 'Fox ends with X' : `${ART[k][0]} is for ${k}`}.`;

// The shape under the finger when a stroke starts (flood fill up to the lines). The crayon only paints inside it.
function regionMask(walls, sx, sy) {
  const N = RES; let start = sy * N + sx;
  for (let r = 1; r <= 14 && walls[start]; r++)  // started on a line: use the nearest open spot
    for (let dy = -r; dy <= r && walls[start]; dy++) for (let dx = -r; dx <= r; dx++) {
      const x = sx + dx, y = sy + dy;
      if (x >= 0 && y >= 0 && x < N && y < N && !walls[y * N + x]) { start = y * N + x; break; }
    }
  if (walls[start]) return null;
  const m = new Uint8Array(N * N), stack = [start]; m[start] = 1;
  while (stack.length) {
    const i = stack.pop(), x = i % N;
    for (const j of [x > 0 ? i - 1 : -1, x < N - 1 ? i + 1 : -1, i - N, i + N])
      if (j >= 0 && j < N * N && !m[j] && !walls[j]) { m[j] = 1; stack.push(j); }
  }
  const c = document.createElement('canvas'); c.width = c.height = N;
  const cx = c.getContext('2d'), img = cx.createImageData(N, N);
  for (let i = 0; i < m.length; i++) if (m[i]) img.data[i * 4 + 3] = 255;
  cx.putImageData(img, 0, 0);
  return c;
}

const CRAYONS = ['#E5534B', '#F2994A', '#F2C94C', '#58B368', '#4A90D9', '#9B6BCC', '#F49AC1', '#A0522D', '#6B6B6B', '#FFFFFF'];
const scratch = document.createElement('canvas'); scratch.width = scratch.height = RES;

function setupColor(box, item) {
  const bw = box.clientWidth, bh = box.parentElement.clientHeight;
  if (!item.page) {  // pick one of 4: two pictures, a letter, a blank page
    const t = Math.floor(Math.min((bw - 16) / 2, (bh - 16) / 2, 340));
    box.innerHTML = `<div class="choose" style="grid-template-columns:repeat(2, ${t}px)">${item.choices.map(k =>
      `<button class="pick card" data-k="${k}" style="width:${t}px;height:${t}px">${k === 'blank' ? '<span class="em">✏️</span>' : ''}</button>`).join('')}</div>`;
    box.querySelectorAll('.pick').forEach(b => {
      if (b.dataset.k !== 'blank') drawPage(b.dataset.k, c => b.append(c));
      b.onclick = () => { item.page = b.dataset.k; item.prompt = pagePrompt(item.page); render(); say(item.prompt); };
    });
    return;
  }
  if (!item.layer) {  // kept on the item so rotating the screen never loses her colouring
    item.layer = document.createElement('canvas'); item.layer.width = item.layer.height = RES;
    item.crayon = CRAYONS[0];
    drawPage(item.page, c => {
      item.lines = c;
      const a = c.getContext('2d').getImageData(0, 0, RES, RES).data;
      item.walls = new Uint8Array(RES * RES).map((_, i) => a[i * 4 + 3] > 100);
      const paper = app.querySelector('.paper'); if (paper && cur.item === item) paper.append(c);  // the page may have been redrawn meanwhile
    });
  }
  // Paper plus 10 big crayons: below the paper when upright, beside it when the screen is wide.
  const wide = bw > bh * 1.2, cols = wide ? 2 : bw >= 700 ? 10 : 5, rows = 10 / cols;
  const sw = Math.floor(Math.min(80, wide ? (bh - 4 * 10) / 5 : (bw - (cols - 1) * 10) / cols));
  const S = Math.floor(wide ? Math.min(bh, bw - cols * (sw + 10) - 16) : Math.min(bw, bh - rows * (sw + 10) - 12));
  box.style.flexDirection = wide ? 'row' : 'column';
  box.innerHTML = `<div class="paper" style="width:${S}px;height:${S}px"></div><div class="palette" style="grid-template-columns:repeat(${cols}, ${sw}px)">${
    CRAYONS.map(c => `<button class="crayon ${c === item.crayon ? 'sel' : ''}" data-c="${c}" style="background:${c};width:${sw}px;height:${sw}px"></button>`).join('')}</div>`;
  const paper = box.querySelector('.paper');
  paper.append(item.layer); if (item.lines) paper.append(item.lines);
  box.querySelectorAll('.crayon').forEach(b => b.onclick = () => {
    item.crayon = b.dataset.c; box.querySelectorAll('.crayon').forEach(o => o.classList.toggle('sel', o === b));
  });
  const lx = item.layer.getContext('2d'), sx = scratch.getContext('2d');
  let mask = null, last = null;
  const at = e => { const r = paper.getBoundingClientRect(), k = v => Math.max(0, Math.min(RES - 1, v));
    return [k((e.clientX - r.left) / r.width * RES), k((e.clientY - r.top) / r.height * RES)]; };
  const paint = (a, b) => {  // stroke on scratch, trim to the shape, copy onto the picture (only the small box around the stroke)
    const x0 = Math.max(0, Math.min(a[0], b[0]) - 30 | 0), y0 = Math.max(0, Math.min(a[1], b[1]) - 30 | 0);
    const w = Math.min(RES - x0, Math.abs(a[0] - b[0]) + 60 | 0), h = Math.min(RES - y0, Math.abs(a[1] - b[1]) + 60 | 0);
    sx.clearRect(x0, y0, w, h);
    sx.strokeStyle = item.crayon; sx.lineWidth = 36; sx.lineCap = 'round';
    sx.beginPath(); sx.moveTo(a[0], a[1]); sx.lineTo(b[0] + 0.01, b[1]); sx.stroke();
    sx.globalCompositeOperation = 'destination-in'; sx.drawImage(mask, x0, y0, w, h, x0, y0, w, h);
    sx.globalCompositeOperation = 'source-over';
    lx.drawImage(scratch, x0, y0, w, h, x0, y0, w, h);
  };
  paper.onpointerdown = e => {
    if (busy || !item.walls) return;
    try { paper.setPointerCapture(e.pointerId); } catch {}
    last = at(e); mask = regionMask(item.walls, last[0] | 0, last[1] | 0);
    if (mask) paint(last, last);
  };
  paper.onpointermove = e => { if (!mask) return; const p = at(e); paint(last, p); last = p; };
  paper.onpointerup = paper.onpointercancel = () => { mask = null; };
}

function showDone() {
  screen = 'done';
  // Quietly adjust difficulty: an easy round (0–1 slips) moves up, a hard one (4+) moves down.
  const lv = cur.level + (cur.missTotal <= 1 ? 1 : cur.missTotal >= 4 ? -1 : 0);
  levels[cur.key] = Math.max(1, Math.min(3, lv)); store.set('levels', levels);
  const find = cur.item.find;
  app.innerHTML = `<div class="center"><div class="big-emoji">👏</div><div class="msg">All done!<br>${find}</div>
    <button class="home" style="width:110px;height:110px;font-size:60px" aria-label="Home">🏠</button></div>`;
  app.querySelector('.home').onclick = showHome;
  say('All done! ' + find);
}

function showRest() {
  screen = 'rest';
  if (!session.locked) { session.locked = true; save(); }
  app.innerHTML = `<div class="night"></div><div class="center"><div class="big-emoji">🌙</div>
    <div class="msg">Screen time is all done!<br>Let's go play with toys.</div></div>
    <button class="grown">Grown-ups</button>`;
  app.querySelector('.grown').onclick = () => showGate(showSettings);
  say("Screen time is all done! Let's go play with toys.");
}

/* ---------- parent gate + settings (rule 7) ---------- */
function showGate(onPass, back = screen === 'rest' ? showRest : showHome, step = 0) {
  screen = 'gate';
  const a = 6 + (Math.random() * 9 | 0), b = 6 + (Math.random() * 9 | 0), sum = a + b;
  const choices = shuffle([sum, sum + 1, sum - 2, sum + 3]);
  app.innerHTML = `<div class="center"><div class="panel card"><h2>For grown-ups</h2>
    <p>${step + 1} of 2: What is ${a} + ${b}?</p><div class="row">${choices.map(c => `<button class="chip" data-v="${c}">${c}</button>`).join('')}</div>
    <button class="wide alt">Back</button></div></div>`;
  app.querySelectorAll('.chip').forEach(c => c.onclick = () => (+c.dataset.v !== sum ? back() : step ? onPass() : showGate(onPass, back, 1)));
  app.querySelector('.wide').onclick = back;
}

function showSettings() {
  screen = 'settings';
  const usedMin = Math.floor(session.used / 60);
  const lv = Object.entries(GAMES).filter(([, g]) => !g.color).map(([k, g]) => `${g.title} ${levels[k] || 2}`).join(' · ');
  app.innerHTML = `<div class="center"><div class="panel card"><h2>Grown-up settings</h2>
    <div>Session length</div><div class="row">${[10, 15, 20].map(m =>
      `<button class="chip ${settings.minutes === m ? 'sel' : ''}" data-m="${m}">${m} min</button>`).join('')}</div>
    <div>Voice</div><div class="row">${[true, false].map(s =>
      `<button class="chip ${settings.sound === s ? 'sel' : ''}" data-s="${s}">${s ? 'On' : 'Off'}</button>`).join('')}</div>
    <p class="note">Used this session: ${usedMin} of ${settings.minutes} min${session.locked ? ' (locked)' : ''}.<br>
    Difficulty (1–3, adjusts itself after each round): ${lv}.<br>
    Tip: turn on Guided Access (iPhone/iPad Settings → Accessibility) so the app can't be swiped away.<br>
    Colouring pictures: OpenMoji (openmoji.org), CC BY-SA 4.0.</p>
    <button class="wide" id="fresh">Start a new session</button>
    <button class="wide alt" id="back">Back</button></div></div>`;
  app.querySelectorAll('[data-m]').forEach(c => c.onclick = () => { settings.minutes = +c.dataset.m; store.set('settings', settings); showSettings(); });
  app.querySelectorAll('[data-s]').forEach(c => c.onclick = () => { settings.sound = c.dataset.s === 'true'; store.set('settings', settings); showSettings(); });
  app.querySelector('#fresh').onclick = () => { session = { used: 0, last: Date.now(), locked: false }; save(); showHome(); };
  app.querySelector('#back').onclick = showHome;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
showHome();
</script>
</body>
</html>
